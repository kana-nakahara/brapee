<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f2ee">
<title>ブラッピー マイページ</title>
<!-- LINE のトークに URL を貼ったときのプレビュー。無いと本文（読み込み中の表示）が出る -->
<meta name="description" content="ブランド品宅配買取ブラッピーのマイページです。お取引の進み具合・査定結果の確認と承認、本人確認書類とお振込先の登録ができます。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ブラッピー">
<meta property="og:title" content="ブラッピー マイページ">
<meta property="og:description" content="ブランド品宅配買取ブラッピーのマイページです。お取引の進み具合・査定結果の確認と承認、本人確認書類とお振込先の登録ができます。">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💎</text></svg>">
</head>
<body data-page="mypage">

<header class="hd">
  <button class="hd-logo" id="btnHome" type="button" aria-label="ホームへ戻る">brappy</button>
  <button class="hd-out" id="btnLogout" hidden>ログアウト</button>
</header>

<main id="app" class="wrap">
  <!-- 開いた瞬間に出すトップの枠（スピナーで真っ白にしない）。見出し・項目名は固定、お客様ごとの値は灰色の仮表示。
       データが届いたら app.js が tpl-top で描き直す。項目を変えたら templates.html の tpl-top と揃える -->
  <div class="skel" aria-busy="true" aria-label="読み込み中">
    <section class="greet">
      <div class="greet-name"><span class="sk" style="width:6em;height:1em"></span> さま</div>
      <div class="greet-sub">LINEアカウントでログイン中</div>
    </section>
    <section class="card case">
      <div class="case-hero">
        <h2 class="t2">お取引進行状況</h2>
        <div class="case-hd"><span class="sk" style="width:10em"></span><span class="sk sk-pill"></span></div>
        <ol class="flow"><li>申込済</li><li>キット</li><li>到達</li><li>集荷</li><li>査定</li><li>承認</li><li>振込</li><li>完了</li></ol>
      </div>
      <div class="case-body">
        <dl class="kv">
          <div><dt>点数</dt><dd><span class="sk" style="width:2.5em"></span></dd></div>
          <div><dt>集荷日</dt><dd><span class="sk" style="width:5em"></span></dd></div>
          <div><dt>キット</dt><dd><span class="sk" style="width:2.5em"></span></dd></div>
        </dl>
        <h2 class="t2">お品物</h2>
        <ul class="items">
          <li><span class="nm"><span class="sk" style="width:70%"></span></span><span class="sk" style="width:4.5em"></span></li>
          <li><span class="nm"><span class="sk" style="width:55%"></span></span><span class="sk" style="width:4.5em"></span></li>
        </ul>
      </div>
    </section>
    <section class="card">
      <h2 class="t2">ご登録の状況</h2>
      <ul class="checks">
        <li><span>本人確認書類</span><span class="sk sk-pill" style="width:4.5em;height:1.5em"></span></li>
        <li><span>お振込先</span><span class="sk sk-pill" style="width:4.5em;height:1.5em"></span></li>
      </ul>
    </section>
    <section class="menu"><button type="button" tabindex="-1">取引履歴・査定履歴・入金履歴 <i>›</i></button></section>
    <a class="btn btn-line" href="#" tabindex="-1">LINEでスタッフに相談する</a>
    <p class="fine">ご住所・お電話番号の変更は、LINEのトークからスタッフへご連絡ください。</p>
  </div>
</main>

<nav class="tabbar" id="tabbar" hidden>
  <button data-view="top" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5L12 4l8.5 6.5V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg>ホーム</button>
  <button data-view="form2"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="11" r="2"/><path d="M6.5 16c.6-1.5 1.5-2.2 2.5-2.2s1.9.7 2.5 2.2M14 10h3.5M14 13.5h3.5"/></svg>登録</button>
  <button data-view="history"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>履歴</button>
</nav>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
